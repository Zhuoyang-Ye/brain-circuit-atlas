<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cerebellum Atlas</title>
<meta name="description" content="An interactive, evidence-linked atlas of the cerebellum, motor cortex, prefrontal cortex, basal ganglia and hippocampus: 3D anatomy in human, macaque and mouse brains, functional maps, microcircuit and molecules, connections to the rest of the brain and body, and a hypothesis lab.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M3 17c0-7 6-12 13-12s13 5 13 12c0 5-5 9-13 9S3 22 3 17z' fill='%231c2230' stroke='%2358a6ff' stroke-width='2'/%3E%3Cpath d='M7 17c2-4 5-6 9-6s7 2 9 6M9.5 21c2-2.6 4-3.6 6.5-3.6s4.5 1 6.5 3.6' fill='none' stroke='%2379c0ff' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
<script>/* set the colour theme before the page is drawn: a saved choice, else the system setting */
(function () { var t; try { t = JSON.parse(localStorage.getItem('ca.theme')); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t); })();</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/atlas" title="Cerebellum Atlas">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <path class="logo-body" d="M3 17c0-7 6-12 13-12s13 5 13 12c0 5-5 9-13 9S3 22 3 17z" fill="#1c2230" stroke="#58a6ff" stroke-width="1.6"/>
      <path class="logo-folds" d="M7 17c2-4 5-6 9-6s7 2 9 6M9.5 21c2-2.6 4-3.6 6.5-3.6s4.5 1 6.5 3.6M16 5.2v4" fill="none" stroke="#79c0ff" stroke-width="1.3" stroke-linecap="round"/>
    </svg>
    <span>Cerebellum Atlas <small>v0.1</small></span>
  </a>
  <nav id="nav" aria-label="Views"></nav>
  <div class="search">
    <input id="search" type="search" placeholder="Search the atlas  ( / )" title="Search entities and papers (press / to jump here)" autocomplete="off" spellcheck="false" aria-label="Search entities and papers">
    <div id="search-results" class="search-results hidden"></div>
  </div>
  <button id="theme-btn" class="icon-btn theme-btn" type="button" title="Switch to light mode" aria-label="Switch to light mode">
    <svg class="i-sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.1" fill="currentColor"/><path d="M8 1.2v1.7M8 13.1v1.7M1.2 8h1.7M13.1 8h1.7M3.2 3.2l1.2 1.2M11.6 11.6l1.2 1.2M3.2 12.8l1.2-1.2M11.6 4.4l1.2-1.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    <svg class="i-moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.6 10.1A5.9 5.9 0 0 1 5.9 2.4a5.9 5.9 0 1 0 7.7 7.7z" fill="currentColor"/></svg>
  </button>
  <button id="about-btn" class="icon-btn" type="button" title="About this atlas, sources and credits">About</button>
</header>

<div id="regionbar" role="status"></div>
<main id="view"></main>

<aside id="panel" class="panel" aria-label="Details">
  <div class="panel-head">
    <button id="panel-back" class="icon-btn" type="button" title="Back" disabled>←</button>
    <span id="panel-kind" class="grow small muted"></span>
    <button id="panel-close" class="icon-btn" type="button" title="Close (Esc)">✕</button>
  </div>
  <div id="panel-body" class="panel-body"></div>
</aside>

<div id="tooltip" role="tooltip"></div>
<div id="modal" class="modal hidden"></div>
<div id="errbar" role="alert"></div>

</html>
